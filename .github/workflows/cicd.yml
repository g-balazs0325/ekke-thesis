name: Linter

on:
  push:
    paths:
      - "dev/**"

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node.js telepítése
        uses: actions/setup-node@v4
        with:
          node-version: 21.1.0

      - name: Typescript telepítése
        run: npm install typescript -g

  error-check:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Typescript hibaellenőrzés
        working-directory: dev
        run: tsc --noEmit

      - name: ESLint hibaellenőrzés
        working-directory: dev
        run: npx eslint .
